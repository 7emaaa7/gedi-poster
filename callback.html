:root{--bg:#fafafa;--fg:#16181d;--muted:#5b616e;--line:#e3e5ea;--accent:#d6204b}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--fg:#ececf0;--muted:#9aa0ad;--line:#2a2d34;--accent:#ff5c7f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header,main,footer{max-width:720px;margin:0 auto;padding:0 20px}
header{display:flex;gap:20px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding-top:28px;padding-bottom:20px;border-bottom:1px solid var(--line)}

.meta{color:var(--muted);font-size:14px}

<body><header><a class="brand" href="index.html">Gedi Poster</a><nav><a href="index.html">Home</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a></nav></header>
<main><h1>TikTok connection</h1>
<p id="msg">Waiting for TikTok.</p>
<script>
var p=new URLSearchParams(location.search);
var m=document.getElementById("msg");
if(p.get("error")){m.textContent="TikTok returned an error: "+(p.get("error_description")||p.get("error"));}
else if(p.get("code")){m.textContent="Connection successful. You can close this page and return to the app.";}
else{m.textContent="This page receives the sign-in result from TikTok. Nothing to do here.";}
</script></main>
